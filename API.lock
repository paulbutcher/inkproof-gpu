theorem Inkproof.Gpu.compileKeeping_log : ∀ (tess : Inkproof.Scene.Command → List UInt32) (c : Inkproof.Gpu.Cache) (keep : List (List (List UInt32))) (tiles : List Inkproof.Gpu.Tile) (g : Inkproof.Gpu.Gpu), (∀ (t : Inkproof.Gpu.Tile), t ∈ tiles → Inkproof.Gpu.Tile.Sound tess t) → c.Valid g → (g.run (Inkproof.Gpu.compileKeeping tess c keep tiles).snd).log = g.log ++ Inkproof.Gpu.frameDraws tess tiles ∧ (Inkproof.Gpu.compileKeeping tess c keep tiles).fst.Valid (g.run (Inkproof.Gpu.compileKeeping tess c keep tiles).snd)
