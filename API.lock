theorem Inkproof.Gpu.viewTile_stride : ∀ (w h : Nat) (v : Inkproof.Gpu.View) (plot : Inkproof.Scene.Rect) (l : Inkproof.Scene.DisplayList), (Inkproof.Gpu.viewTile w h v plot l).stride = 6
theorem Inkproof.Gpu.viewTile_view : ∀ (w h : Nat) (v : Inkproof.Gpu.View) (plot : Inkproof.Scene.Rect) (l : Inkproof.Scene.DisplayList), (Inkproof.Gpu.viewTile w h v plot l).view = Inkproof.Gpu.viewWords w h
def Inkproof.Gpu.viewWords : Nat → Nat → List UInt32
theorem Inkproof.Gpu.viewWords_eq : ∀ (w h : Nat), Inkproof.Gpu.viewWords w h = [(Inkproof.Gpu.ratToFloat32 (↑w / 2)).toBits, (Inkproof.Gpu.ratToFloat32 (↑h / 2)).toBits, (Inkproof.Gpu.ratToFloat32 (2 / ↑w)).toBits, (Inkproof.Gpu.ratToFloat32 (2 / ↑h)).toBits]
def Inkproof.Gpu.viewX : Inkproof.Gpu.View → Inkproof.Scene.Rect → Inkproof.Scale.Affine Rat
theorem Inkproof.Gpu.viewX_apply : ∀ (v : Inkproof.Gpu.View) (plot : Inkproof.Scene.Rect) (x : Rat), (Inkproof.Gpu.viewX v plot).apply x = plot.x0 + (x - v.x0) * ((plot.x1 - plot.x0) / (v.x1 - v.x0))
theorem Inkproof.Gpu.viewX_ends : ∀ (v : Inkproof.Gpu.View) (plot : Inkproof.Scene.Rect), v.x0 ≠ v.x1 → (Inkproof.Gpu.viewX v plot).apply v.x0 = plot.x0 ∧ (Inkproof.Gpu.viewX v plot).apply v.x1 = plot.x1
def Inkproof.Gpu.viewY : Inkproof.Gpu.View → Inkproof.Scene.Rect → Inkproof.Scale.Affine Rat
theorem Inkproof.Gpu.viewY_apply : ∀ (v : Inkproof.Gpu.View) (plot : Inkproof.Scene.Rect) (y : Rat), (Inkproof.Gpu.viewY v plot).apply y = plot.y1 + (y - v.y0) * ((plot.y0 - plot.y1) / (v.y1 - v.y0))
theorem Inkproof.Gpu.viewY_ends : ∀ (v : Inkproof.Gpu.View) (plot : Inkproof.Scene.Rect), v.y0 ≠ v.y1 → (Inkproof.Gpu.viewY v plot).apply v.y0 = plot.y1 ∧ (Inkproof.Gpu.viewY v plot).apply v.y1 = plot.y0
def Inkproof.Gpu.webglBody : String → List String
theorem Inkproof.Gpu.webglBody_createBuffer : Inkproof.Gpu.webglBody "createBuffer" = ["s.buffers.set(a[0], gl.createBuffer());"]
theorem Inkproof.Gpu.webglBody_createProgram : Inkproof.Gpu.webglBody "createProgram" = ["s.programs.set(a[0], buildProgram(gl));"]
theorem Inkproof.Gpu.webglBody_unknown : ∀ (n : String), ¬n ∈ ["createBuffer", "bufferData", "deleteBuffer", "useProgram", "uniform", "draw", "clear", "createProgram", "scissor"] → Inkproof.Gpu.webglBody n = []
theorem Inkproof.Gpu.webglBody_useProgram : Inkproof.Gpu.webglBody "useProgram" = ["s.current = s.programs.get(a[0]);", "gl.useProgram(s.current.program);", "gl.enable(gl.BLEND);", "gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);"]
def Inkproof.Gpu.wordsEq : List (List UInt32) → List (List UInt32) → Bool
theorem Inkproof.Gpu.wordsEq_eq : ∀ (a b : List (List UInt32)), Inkproof.Gpu.wordsEq a b = Decidable.decide (a = b)
